tracker_name: visual-analogy
wandb_run_name: "analora_flux2_klein_analogy"

output_dir: "experiments/analora_flux2_klein"

# Model family: flux2_klein | qwen_image21 (inferred from pretrained_model_name_or_path if absent).
backbone: flux2_klein
pretrained_model_name_or_path: "black-forest-labs/FLUX.2-klein-base-9B"

# Training data: Hugging Face dataset id and optional revision (branch, tag or commit).
dataset: "selective-image-analogy/SIA-Multi-Edit-Analogy"
dataset_revision: null

seed: 0
checkpointing_steps: 500
validation_steps: 20

num_val_inference_steps: 28

lora_rank: 16
lora_dropout: 0.0

resume_from_checkpoint: true
max_train_steps: 15000

lr_warmup_steps: 0
learning_rate: 5e-5
train_batch_size: 16
gradient_accumulation_steps: 1
max_grad_norm: 1
# Timestep sampling range — keep aligned with scheduler's 1000 steps
max_train_timesteps: 1000
min_train_timesteps: 0
